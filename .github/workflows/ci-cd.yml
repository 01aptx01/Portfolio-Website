name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Continuous Integration (CI) - Lint, Type Check, and Build
  # ============================================================================
  ci:
    name: Build & Verify (CI)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔍 TypeScript Type Check
        run: npm run typecheck

      - name: 🧹 ESLint Verification
        run: npm run lint

      - name: 🏗️ Production Build Verification
        run: npm run build
        env:
          GITHUB_ACTIONS: "true"

  # ============================================================================
  # Continuous Deployment (CD) - Deploy to GitHub Pages (Main Branch Only)
  # ============================================================================
  cd:
    name: Deploy to GitHub Pages (CD)
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Required permissions for GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🏗️ Build & Export Static Site
        run: npm run build
        env:
          GITHUB_ACTIONS: "true"

      - name: 🌐 Configure GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: 📦 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
